name: WASM App Build

on:
  push:
    tags:
      - '*'
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:

  #
  # Emscripten build of nfc-decoder-wasm-bin + WASM test
  #
  build-wasm:
    name: Build WASM module
    runs-on: ubuntu-latest

    steps:

      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Configure (Emscripten)
        run: cmake -S emscripten -B build-em -G "Unix Makefiles"

      - name: Build
        run: cmake --build build-em -j$(nproc)

      - name: Run test-sdr-wasm
        working-directory: build-em
        run: node test-sdr-wasm.js

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nfc-decoder-wasm
          path: |
            build-em/nfc-decoder-wasm-bin.js
            build-em/nfc-decoder-wasm-bin.wasm

  #
  # Vite build of the nfc-rx-web browser app
  #
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    needs: build-wasm

    steps:

      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/nfc-app/app-rx-web/package-lock.json

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: nfc-decoder-wasm
          path: src/nfc-app/app-rx-web/pkg

      - name: Install dependencies
        working-directory: src/nfc-app/app-rx-web
        run: npm ci

      - name: Build web app
        working-directory: src/nfc-app/app-rx-web
        run: npm run build

      - name: Copy WASM into dist
        working-directory: src/nfc-app/app-rx-web
        run: |
          mkdir -p dist/pkg
          cp pkg/nfc-decoder-wasm-bin.js pkg/nfc-decoder-wasm-bin.wasm dist/pkg/

      - name: Upload web app
        uses: actions/upload-artifact@v7
        with:
          name: nfc-rx-web
          path: src/nfc-app/app-rx-web/dist

  #
  # Deploy the web app to GitHub Pages (tag pushes only)
  #
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/nfc-app/app-rx-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
